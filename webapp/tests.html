<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests du moteur</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #f6f8fa; color: #0f172a; }
    h1 { font-size: 18px; } .ok { color: #15803d; } .ko { color: #b91c1c; font-weight: 700; }
    li { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    #summary { font-size: 16px; font-weight: 700; padding: 10px 14px; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <h1>Tests du moteur web (références : tests/TestRegression.m)</h1>
  <div id="summary">…</div>
  <ul id="out"></ul>
  <script src="referentiel.js"></script>
  <script src="core.js"></script>
  <script src="xlsx.js"></script>
  <script>
  (() => {
    const K = window.EtalonnageCore, out = document.getElementById('out');
    let pass = 0, fail = 0;
    const log = (ok, name, detail = '') => {
      ok ? pass++ : fail++;
      const li = document.createElement('li'); li.className = ok ? 'ok' : 'ko';
      li.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? ' — ' + detail : ''}`; out.append(li);
    };
    const near = (name, got, exp, tol = 1e-12) => {
      const ok = Array.isArray(exp) ? exp.every((e, i) => Math.abs(got[i] - e) <= tol) : Math.abs(got - exp) <= tol;
      log(ok, name, ok ? '' : `obtenu ${JSON.stringify(got)}, attendu ${JSON.stringify(exp)}`);
    };
    const throwsCode = (name, fn, code) => {
      try { fn(); log(false, name, 'aucune erreur'); } catch (e) { log(e.code === code, name, e.code === code ? '' : `code ${e.code}`); }
    };
    const pts = (x, c, u) => x.map((v, i) => ({ x: v, c: c[i], u: u[i] }));
    const meta = { nature: 'U', unitI: 'u', unitC: 'u' };

    // casAExact
    {
      const x = [0, 10, 20, 30], C = [.1, .2, .3, .4], U = [.2, .22, .24, .26];
      const c = K.ajusterDroite(x, C), u = K.ajusterDroite(x, U);
      near('A: a correction', c.a, .01); near('A: b correction', c.b, .1);
      near('A: résidus nuls', c.residu, [0, 0, 0, 0]); near('A: R² = 1', c.R2, 1);
      near('A: a incertitude', u.a, .002); near('A: b incertitude', u.b, .2);
      const v = K.valider(x.map((xi, i) => [String(xi), String(C[i]), String(U[i])]), { mode: 'fraction', alphaC: '0.25', alphaU: '0.25' });
      near('A: seuil 25 % moyenne U', v.sC, .0575);
      const A = K.analyser(v.pts, v.sC, v.sU);
      log(x.every((xi, i) => A.maj.a * xi + A.maj.b >= U[i] - 1e-12), 'A: majorante >= U aux points');
      const r = K.calculer(A, meta, 15, 'regression', true);
      near('A: correction en 15', r.C, .25); near('A: valeur corrigée', r.corrected, 15.25); near('A: incertitude majorante', r.U, .23);
      throwsCode('A: 31 hors étendue', () => K.calculer(A, meta, 31, 'regression', true), 'outOfRange');
      throwsCode('A: modèles non confirmés', () => K.calculer(A, meta, 15, 'regression', false), 'confirm');
      throwsCode('A: nature inconnue bloque', () => K.calculer(A, { ...meta, nature: '' }, 15, 'regression', true), 'nature');
      throwsCode('A: unités incompatibles bloquent', () => K.calculer(A, { ...meta, unitC: 'mV' }, 15, 'regression', true), 'unitsCalc');
      throwsCode('A: unité correction absente bloque', () => K.calculer(A, { ...meta, unitC: '' }, 15, 'regression', true), 'unitsCalc');
      near('A: bornes incluses (0)', K.calculer(A, meta, 0, 'regression', true).uFit, .2);
      near('A: bornes incluses (30)', K.calculer(A, meta, 30, 'interpolation', true).C, .4);
    }
    // casBReference
    {
      const x = [0, 20, 50, 80, 100], C = [.4, .1, .8, .3, .2], U = [.8, .3, .5, .7, .2];
      const c = K.ajusterDroite(x, C), u = K.ajusterDroite(x, U);
      near('B: a', c.a, -.0005882352941176471); near('B: b', c.b, .3894117647058824);
      near('B: résidu max', c.residuMax, .44); near('B: R²', c.R2, .008058017727639);
      near('B: s_res', c.sRes, .3107233811734211);
      near('B: b majorante', u.b + u.residuMax, .911764705882353);
      // Contrôle indépendant par équations normales (formule non centrée).
      const n = x.length, Sx = x.reduce((s, v) => s + v, 0), Sy = C.reduce((s, v) => s + v, 0);
      const Sxy = x.reduce((s, v, i) => s + v * C[i], 0), Sxx = x.reduce((s, v) => s + v * v, 0);
      const a2 = (n * Sxy - Sx * Sy) / (n * Sxx - Sx * Sx);
      near('B: pente = équations normales', c.a, a2, 1e-12); near('B: ordonnée = équations normales', c.b, (Sy - a2 * Sx) / n, 1e-12);
      const A = K.analyser(pts(x, C, U), .25 * .5, .25 * .5);
      log(A.decC.ok === false, 'B: correction non représentative (0,44 > 0,125)');
      log(A.decC.r2 === 'r2.low', 'B: remarque R² faible (informative)');
    }
    // casConstant
    {
      const m = K.ajusterDroite([0, 10, 20], [.2, .2, .2]);
      near('Constant: a = 0', m.a, 0); log(Number.isNaN(m.R2), 'Constant: R² indéfini'); near('Constant: s_res = 0', m.sRes, 0);
      log(K.evaluerCritere(m, 0).ok === true, 'Constant: non rejeté à cause du R² indéfini');
      log(K.evaluerCritere(m, 0).r2 === 'r2.undef', 'Constant: remarque « données constantes »');
    }
    // validationEtSeuils
    {
      const s = { mode: 'fraction', alphaC: '0.25', alphaU: '0.25' };
      log(K.valider([['0', '.1', '.2'], ['10', '.2', '.3']], s).errors[0]?.code === 'minPoints', 'Validation: 2 points refusés (minimum 3)');
      log(K.valider([['10', '.1', '.2'], ['10', '.2', '.3'], ['10', '.3', '.4']], s).errors.some(e => e.code === 'dup'), 'Validation: doublons refusés');
      log(K.valider([['0', '.1', '.2'], ['10', '.2', '-.1'], ['20', '.3', '.4']], s).errors.some(e => e.code === 'negU'), 'Validation: U négative refusée');
      log(K.valider([['0', '.1', '.2'], ['10', 'abc', '.3'], ['20', '.3', '.4']], s).errors.some(e => e.code === 'nan'), 'Validation: texte refusé (pas de zéro silencieux)');
      log(K.valider([['0', '.1', '.2'], ['10', '', '.3'], ['20', '.3', '.4']], s).errors.some(e => e.code === 'nan'), 'Validation: cellule vide refusée');
      log(K.valider([['0', '.1', '.2'], ['10', '.2', '.3'], ['20', '.3', '.4']], { ...s, alphaC: '-1' }).errors.some(e => e.code === 'threshold'), 'Validation: fraction négative refusée');
      log(K.valider([['0', '.1', '.2'], ['10', '.2', '.3'], ['20', '.3', '.4']], { mode: 'absolute', limitC: '0.1', limitU: 'x' }).errors.some(e => e.code === 'threshold'), 'Validation: seuil absolu invalide refusé');
      const v = K.valider([['20', '.3', '.4'], ['0', '.1', '0'], ['10', '.2', '.3']], s);
      log(v.needsSort && !v.errors.length, 'Validation: tri proposé, pas imposé');
      log(v.warnings.includes('warn.zeroU') && v.warnings.includes('warn.three'), 'Validation: avertissements U = 0 et 3 points');
      throwsCode('Analyse: refuse des points non triés', () => K.analyser(v.pts, v.sC, v.sU), 'notSorted');
    }
    // Normalisation
    {
      near('Parse: virgule décimale', K.parseNum('0,25'), .25);
      near('Parse: moins Unicode', K.parseNum('−0,5'), -.5);
      near('Parse: ± incertitude', K.parseNum('± 0,27', true), .27);
      log(Number.isNaN(K.parseNum('± 0,27')), 'Parse: ± refusé hors incertitude');
      log(Number.isNaN(K.parseNum('1.234,5')), 'Parse: format ambigu refusé');
      log(Number.isNaN(K.parseNum('12 °C')), 'Parse: suffixe d’unité refusé');
      near('Parse: espace insécable', K.parseNum('1 000,5'), 1000.5);
    }
    // interpolationAuxPoints
    {
      const p = pts([0, 10, 20], [1, 3, 2], [0, 0, 0]);
      near('Interpolation: retrouve C au point', K.interpolation(10, p), 3);
      near('Interpolation: entre points', K.interpolation(15, p), 2.5);
      throwsCode('Interpolation: hors étendue', () => K.interpolation(21, p), 'outOfRange');
    }
    // Incertitude ajustée négative dans l'étendue
    {
      const A = K.analyser(pts([0, 10, 20], [0, 0, 0], [0, 0, 1]), 1, 1);
      near('U ajustée: a', A.u.a, .05); near('U ajustée: b', A.u.b, -1 / 6);
      throwsCode('U(I) négative à une borne : calcul bloqué (jamais remplacée par 0)', () => K.calculer(A, meta, 15, 'regression', true), 'negModel');
      log(A.maj.usable, 'Majorante utilisable (>= U >= 0 aux bornes)');
    }
    // Classification des familles exclues
    {
      const F = window.EtalonnageRef.FAMILLES_EXCLUES, c = K.classerFamille;
      const got = [c('Cale étalon 25 mm'), c('', 'Pied à coulisse numérique'), c('Poids étalon 1 kg classe F1'),
        c('', 'Burette 50 mL'), c('Température (°C)', 'Thermomètre'), c('Masse (g)', 'Balance — poids étalons classe F1')];
      log(JSON.stringify(got) === JSON.stringify([F[0], F[0], F[1], F[2], 'Autre', 'Autre']), 'Familles exclues : classification par mots-clés', JSON.stringify(got));
    }
    // Cas de test du cahier des charges CalibFit (tolérance 1e-6)
    {
      const rows = [[0, '0,10', '0,05'], [20, '0,00', '0,06'], [40, '-0,10', '0,08'], [60, '-0,10', '0,08'], [80, '-0,20', '0,09'], [100, '-0,30', '0,10']]
        .map(r => r.map(String));
      const v = K.valider(rows, { mode: 'fraction', alphaC: '0.25', alphaU: '0.25' });
      const A = K.analyser(v.pts, v.sC, v.sU);
      const t6 = 1e-6;
      near('Cahier: a_C', A.c.a, -0.00371429, t6); near('Cahier: b_C', A.c.b, 0.0857143, t6);
      near('Cahier: résidu max C', A.c.residuMax, 0.0371429, t6);
      near('Cahier: a_U', A.u.a, 0.000485714, t6); near('Cahier: b_U', A.u.b, 0.0523810, t6);
      near('Cahier: résidu max U', A.u.residuMax, 0.00819048, t6);
      const m = { nature: 'U', unitI: '°C', unitC: '°C', unitU: '°C' };
      const r = K.calculer(A, m, 50, 'regression', true);
      near('Cahier: C(50)', r.C, -0.1, t6); near('Cahier: valeur corrigée', r.corrected, 49.9, t6);
      near('Cahier: U(50)', r.uFit, 0.0766667, t6); near('Cahier: U prudente(50)', r.uPrudent, 0.0848571, t6);
      throwsCode('Cahier: I = 120 bloqué', () => K.calculer(A, m, 120, 'regression', true), 'outOfRange');
      throwsCode('Cahier: I = −5 bloqué', () => K.calculer(A, m, -5, 'regression', true), 'outOfRange');
      log(K.alerteLinearite(A, m) === false, 'Cahier: résidu max C (0,037) < plus petite U (0,05) : pas d’alerte de linéarité');
      log(K.alerteLinearite(A, { ...m, unitU: 'K' }) === false, 'Linéarité : unités différentes, pas de comparaison');
      const B = K.analyser([{ x: 0, c: 0, u: .01 }, { x: 10, c: .5, u: .01 }, { x: 20, c: 0, u: .01 }], 1, 1);
      log(K.alerteLinearite(B, m) === true, 'Linéarité : résidu max > plus petite U → alerte');
    }
    // Classeur Excel : vraies formules + valeurs en cache identiques au moteur
    {
      const rows = [[0, '0,10', '0,05'], [20, '0,00', '0,06'], [40, '-0,10', '0,08'], [60, '-0,10', '0,08'], [80, '-0,20', '0,09'], [100, '-0,30', '0,10']]
        .map(r => r.map(String));
      const v = K.valider(rows, { mode: 'fraction', alphaC: '0.25', alphaU: '0.25' });
      const A = K.analyser(v.pts, v.sC, v.sU);
      const X = window.EtalonnageXlsx;
      const meta = { certificate: 'CE 01/26', instrument: 'Thermomètre', date: '2026-07-15', unitI: '°C', unitC: '°C', unitU: '°C', k: '2', nature: 'U' };
      const files = X.unzipStored(X.build(A, meta, { kVerified: true }));
      const s1 = files['xl/worksheets/sheet1.xml'], s2 = files['xl/worksheets/sheet2.xml'];
      const cached = (xml, ref) => +new RegExp(`<c r="${ref}"[^>]*><f>[^<]*</f><v>([^<]*)</v>`).exec(xml)?.[1];
      log(Object.keys(files).length === 15 && !!files['xl/charts/chart1.xml'] && !!files['xl/charts/chart2.xml'], 'Excel: 2 feuilles, 2 graphiques');
      log(/<sheet name="Interpolation"/.test(files['xl/workbook.xml']) && /<sheet name="Modélisation"/.test(files['xl/workbook.xml']), 'Excel: feuilles « Interpolation » et « Modélisation »');
      log(s1.includes('<f>SLOPE(C11:C16,B11:B16)</f>') && s1.includes('<f>INTERCEPT(C11:C16,B11:B16)</f>') && s1.includes('<f>RSQ(C11:C16,B11:B16)</f>')
        && s1.includes('<f>COUNT(B11:B16)</f>') && s1.includes('<f>MAX(F11:F16)</f>'), 'Excel: formules SLOPE, INTERCEPT, RSQ, COUNT, MAX présentes');
      log(s1.includes('<f>$J$11*B11+$J$12</f>') && s1.includes('<f>C11-D11</f>') && s1.includes('<f>ABS(E11)</f>'), 'Excel: ajustée, résidu et |résidu| en formules');
      log(s2.includes('<f>D11+$J$15</f>'), 'Excel: U prudente = ajustée + résidu max (formule)');
      near('Excel: a_C en cache = moteur', cached(s1, 'J11'), A.c.a, 1e-15); near('Excel: b_C en cache', cached(s1, 'J12'), A.c.b, 1e-15);
      near('Excel: résidu max C en cache', cached(s1, 'J15'), 0.0371429, 1e-6);
      near('Excel: a_U en cache', cached(s2, 'J11'), 0.000485714, 1e-6); near('Excel: résidu max U en cache', cached(s2, 'J15'), 0.00819048, 1e-6);
      log(/<c:trendlineType val="linear"\/><c:dispRSqr val="1"\/><c:dispEq val="1"\/>/.test(files['xl/charts/chart1.xml']), 'Excel: courbe de tendance linéaire avec équation et R²');
      log(files['xl/charts/chart2.xml'].includes("'Modélisation'!$B$11:$B$16"), 'Excel: graphique lié aux cellules');
      log(/orientation="landscape"/.test(s1) && /state="frozen"/.test(s1), 'Excel: paysage et volets figés');
      log(X.fileName(meta) === 'certificat_CE-01-26_Thermometre_2026-07-15.xlsx', 'Excel: nom de fichier certificat_<n°>_<série>_<date>');
      log(X.crc32(new TextEncoder().encode('123456789')) === 0xcbf43926, 'ZIP: CRC-32 de référence');
    }
    // Incertitude relative (% de la lecture) : U_abs = U% × |I| / 100
    {
      const v = K.valider([['10', '0', '1'], ['-20', '0', '1'], ['50', '0', '2']], { mode: 'fraction', alphaC: '0.25', alphaU: '0.25', uncType: 'relative' });
      near('Relative: U_abs', v.pts.map(p => p.u), [0.1, 0.2, 1]);
      near('Relative: valeur d’origine conservée', v.pts.map(p => p.uRaw), [1, 1, 2]);
    }
    // Arrondi d'affichage de l'incertitude : 2 chiffres significatifs, vers le haut
    {
      const a = u => K.arrondirIncertitude(u);
      log(a(0.0766667).value === 0.077 && a(0.0766667).decimals === 3, 'Arrondi: 0,0766667 → 0,077 (3 décimales)');
      log(a(0.0848571).value === 0.085, 'Arrondi: 0,0848571 → 0,085');
      log(a(0.08).value === 0.08, 'Arrondi: 0,08 reste 0,08 (pas de faux arrondi flottant)');
      log(a(0.121).value === 0.13, 'Arrondi: 0,121 → 0,13 (vers le haut)');
      log(a(2.41).value === 2.5 && a(2.41).decimals === 1, 'Arrondi: 2,41 → 2,5');
      log(a(37).value === 37 && a(37).decimals === 0, 'Arrondi: 37 → 37');
      log(a(123).value === 130 && a(123).decimals === 0, 'Arrondi: 123 → 130');
    }
    // Lignes de certificat (convention Correction = −Erreur)
    {
      const r1 = K.ligneCertificat([-0.08, 0, 0.08], .27);
      log(r1.ok && r1.ref === -0.08 && r1.eq === 0 && r1.err === 0.08, 'Certificat: réf | équip | erreur');
      const r2 = K.ligneCertificat([24.9, 25.02, -0.12], .42);
      log(r2.ok && r2.ref === 25.02 && r2.eq === 24.9, 'Certificat: équip | réf | erreur');
      log(!K.ligneCertificat([-0.08, 0.08, 0], .27).ok, 'Certificat: colonnes mélangées signalées');
      log(!K.ligneCertificat([10, 10.5, 0.9], .3).ok, 'Certificat: erreur imprimée incohérente signalée');
      log(!K.ligneCertificat([11.76, 1.84], 1.7).ok, 'Certificat: erreur absente signalée (jamais acceptée en silence)');
    }

    document.getElementById('summary').textContent = `${pass} réussis, ${fail} échoués`;
    document.getElementById('summary').className = fail ? 'ko' : 'ok';
    window.__resultats = { pass, fail };
  })();
  </script>
</body>
</html>
